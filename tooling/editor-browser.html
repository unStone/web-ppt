<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Web-PPT Editor Browser Contract</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px system-ui; background: #eef2f7; }
    #mount { width: 960px; height: 540px; overflow: hidden; background: white; box-shadow: 0 8px 30px #1e293b30; }
    #mount [data-ppt-stage] { transform-origin: 0 0; }
    .contract-offscreen { position: absolute; left: -10000px; top: 0; width: 1280px; height: 720px; }
    #report { white-space: pre-wrap; color: #166534; }
  </style>
</head>
<body>
  <h1>Web-PPT Editor Browser Contract</h1>
  <pre id="report" role="status">RUNNING</pre>
  <div id="mount"></div>
  <div id="font-mount" class="contract-offscreen"></div>
  <div id="perf-mount" class="contract-offscreen"></div>
  <div id="owned-mount" class="contract-offscreen"></div>
  <script type="module">
    import { openEditor } from '/out/editor/editor.mjs';

    const report = document.querySelector('#report');
    const mount = document.querySelector('#mount');
    const fontMount = document.querySelector('#font-mount');
    const perfMount = document.querySelector('#perf-mount');
    const ownedMount = document.querySelector('#owned-mount');
    const load = async (name) => {
      const response = await fetch(`/fixtures/${name}`);
      if (!response.ok) throw new Error(`${name} HTTP ${response.status}`);
      return response.arrayBuffer();
    };
    try {
      const session = await openEditor(await load('sample-edit-basic.pptx'), { idPrefix: 'browser-contract-' });
      const view = session.mount(mount, { mode: 'edit', zoom: 0.75 });
      const staticLayer = mount.querySelector('[data-ppt-layer="static"]');
      const roots = session.editor.doc.slides[view.slideId].children;
      const [targetId, siblingId] = roots;
      const targetBefore = staticLayer.querySelector(`[data-edit-id="${targetId}"]`);
      const siblingBefore = staticLayer.querySelector(`[data-edit-id="${siblingId}"]`);
      const svgBefore = staticLayer.querySelector('svg');
      session.editor.exec({
        type: 'SetXfrm', id: targetId, x: session.editor.doc.elements[targetId].src.x + 20,
      });
      const ok = mount.querySelectorAll('[data-ppt-layer]').length === 3
        && staticLayer.querySelector(`[data-edit-id="${targetId}"]`) !== targetBefore
        && staticLayer.querySelector(`[data-edit-id="${siblingId}"]`) === siblingBefore
        && staticLayer.querySelector('svg') === svgBefore
        && staticLayer.querySelector('image')?.getAttribute('href')?.startsWith('blob:');
      if (!ok) throw new Error('三层、增量 DOM 身份或图片资源断言失败');

      view.destroy();
      const hitSession = await openEditor(await load('sample-editor-hit.pptx'), { idPrefix: 'browser-hit-' });
      const hitView = hitSession.mount(mount, { mode: 'edit', zoom: 0.75, textMode: 'svg' });
      mount.scrollIntoView({ block: 'start' });
      const byName = (name) => Object.values(hitSession.editor.doc.elements)
        .find((record) => record.src.name === name)?.id;
      const ids = {
        solid: byName('hit-solid'), outline: byName('hit-outline'),
        lower: byName('hit-overlap-lower'), upper: byName('hit-overlap-upper'),
        outer: byName('hit-outer-group'), inner: byName('hit-inner-group'), leaf: byName('hit-nested-leaf'),
      };
      if (Object.values(ids).some((id) => !id)) throw new Error('命中固件缺少稳定元素');
      const hitAt = (x, y, init = {}) => {
        const rect = mount.getBoundingClientRect();
        const clientX = rect.left + x * 0.75;
        const clientY = rect.top + y * 0.75;
        const target = document.elementFromPoint(clientX, clientY);
        if (!target) throw new Error(`命中点落在视口外：${x},${y}`);
        const accepted = target.dispatchEvent(new PointerEvent('pointerdown', {
          bubbles: true, composed: true, cancelable: true, pointerType: 'mouse', button: 0,
          clientX, clientY, ...init,
        }));
        return { target, accepted, clientX, clientY };
      };
      const selected = (id, enteredGroup = null) => hitSession.editor.selection.kind === 'elements'
        && hitSession.editor.selection.ids[0] === id
        && hitSession.editor.selection.enteredGroup === enteredGroup;

      hitAt(190, 170);
      if (!selected(ids.solid)) throw new Error('实心 SVG 原生命中失败');
      hitSession.editor.select({ kind: 'none' });
      hitAt(470, 170);
      if (hitSession.editor.selection.kind !== 'none') throw new Error('无填充形状的中心不应命中');
      hitAt(363, 170);
      if (!selected(ids.outline)) throw new Error('无填充形状的描边应可命中');
      hitAt(820, 190);
      if (!selected(ids.upper)) throw new Error('重叠形状未选中最上层');
      hitAt(820, 190, { altKey: true });
      const altReachedLower = selected(ids.lower);
      hitAt(820, 190, { altKey: true });
      if (!altReachedLower || !selected(ids.upper)) throw new Error('Alt 未按浏览器 z 序循环');

      const nestedHit = hitAt(250, 470);
      if (!selected(ids.outer)) throw new Error('组内点选未默认选外层组');
      nestedHit.target.dispatchEvent(new MouseEvent('dblclick', {
        bubbles: true, composed: true, cancelable: true,
        clientX: nestedHit.clientX, clientY: nestedHit.clientY,
      }));
      if (!selected(ids.inner, ids.outer)) throw new Error('双击未进入外层组');
      nestedHit.target.dispatchEvent(new MouseEvent('dblclick', {
        bubbles: true, composed: true, cancelable: true,
        clientX: nestedHit.clientX, clientY: nestedHit.clientY,
      }));
      if (!selected(ids.leaf, ids.inner)) throw new Error('双击未逐层进入内层组');
      hitView.element.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      if (!selected(ids.inner, ids.outer)) throw new Error('Escape 未逐层退出内层组');

      hitSession.editor.select({ kind: 'elements', ids: [ids.upper], enteredGroup: null });
      hitView.setMode('view');
      const viewEvent = hitAt(190, 170);
      if (!viewEvent.accepted || !selected(ids.upper)) throw new Error('查看模式不应拦截或修改选区');
      hitView.setMode('edit');

      const ownedView = hitSession.mount(ownedMount, { mode: 'edit', textMode: 'svg' });
      const ownedTarget = ownedMount.querySelector(`[data-edit-id="${ids.solid}"]`);
      hitSession.editor.select({ kind: 'none' });
      ownedTarget.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true }));
      if (!selected(ids.solid)) throw new Error('共享会话的第二视图未提交选区');
      ownedView.destroy();
      document.body.append(ownedView.element);
      hitSession.editor.select({ kind: 'none' });
      ownedTarget.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true }));
      if (hitSession.editor.selection.kind !== 'none') throw new Error('已销毁视图仍然响应选择事件');
      ownedView.element.remove();

      const hitSamples = [];
      for (let index = 0; index < 80; index++) {
        const started = performance.now();
        hitAt(index % 2 ? 363 : 190, 170);
        hitSamples.push(performance.now() - started);
      }
      hitSamples.sort((left, right) => left - right);
      const hitP95 = hitSamples[Math.floor(hitSamples.length * 0.95)];
      if (hitP95 > 8) throw new Error(`点选反馈 p95 ${hitP95.toFixed(3)}ms`);

      hitView.destroy();
      const spaceSession = await openEditor(await load('sample-editor-space.pptx'), { idPrefix: 'browser-space-' });
      const spaceView = spaceSession.mount(mount, { mode: 'edit', textMode: 'svg' });
      const spaceByName = (name) => Object.values(spaceSession.editor.doc.elements)
        .find((record) => record.src.name === name);
      const spaceRecords = [
        spaceByName('space-plain'),
        spaceByName('space-rotated-flipped'),
        spaceByName('space-nested-leaf'),
      ];
      if (spaceRecords.some((record) => !record)) throw new Error('坐标固件缺少稳定元素');
      const polygonPoints = (polygon) => polygon.getAttribute('points').trim().split(/\s+/).map((pair) => {
        const [x, y] = pair.split(',').map(Number);
        return new DOMPoint(x, y);
      });
      const screenPoint = (point, matrix) => point.matrixTransform(matrix);
      const midpoint = (left, right) => new DOMPoint((left.x + right.x) / 2, (left.y + right.y) / 2);
      const frameError = (record, zoom) => {
        spaceView.setZoom(zoom);
        spaceSession.editor.select({ kind: 'elements', ids: [record.id], enteredGroup: null });
        const target = mount.querySelector(`[data-edit-id="${record.id}"]`);
        const base = target?.querySelector(':scope > g[transform]');
        const polygon = mount.querySelector('[data-edit-selection-frame]');
        const handle = mount.querySelector('[data-edit-handle="nw"]');
        const targetMatrix = base?.getScreenCTM();
        const overlayMatrix = polygon?.getScreenCTM();
        if (!targetMatrix || !overlayMatrix || !handle) throw new Error(`无法取得 ${record.src.name} 的屏幕矩阵`);
        const expected = [
          new DOMPoint(0, 0), new DOMPoint(record.src.w, 0),
          new DOMPoint(record.src.w, record.src.h), new DOMPoint(0, record.src.h),
        ].map((point) => screenPoint(point, targetMatrix));
        const actual = polygonPoints(polygon).map((point) => screenPoint(point, overlayMatrix));
        const error = Math.max(...actual.map((point, index) =>
          Math.hypot(point.x - expected[index].x, point.y - expected[index].y)));
        const [nw, ne, se, sw] = expected;
        const expectedScaleHandles = [
          nw, midpoint(nw, ne), ne, midpoint(ne, se), se, midpoint(se, sw), sw, midpoint(sw, nw),
        ];
        const handleNames = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
        const handleRects = handleNames.map((name) =>
          mount.querySelector(`[data-edit-handle="${name}"]`).getBoundingClientRect());
        const handlePositionError = Math.max(...handleRects.map((rect, index) => Math.hypot(
          rect.left + rect.width / 2 - expectedScaleHandles[index].x,
          rect.top + rect.height / 2 - expectedScaleHandles[index].y,
        )));
        const top = midpoint(nw, ne);
        const center = midpoint(nw, se);
        const outwardX = top.x - center.x;
        const outwardY = top.y - center.y;
        const outwardLength = Math.hypot(outwardX, outwardY);
        const expectedRotation = new DOMPoint(
          top.x + outwardX / outwardLength * 24,
          top.y + outwardY / outwardLength * 24,
        );
        const rotationRect = mount.querySelector('[data-edit-handle="rotate"]').getBoundingClientRect();
        const actualRotation = new DOMPoint(
          rotationRect.left + rotationRect.width / 2,
          rotationRect.top + rotationRect.height / 2,
        );
        const rotationError = Math.hypot(
          actualRotation.x - expectedRotation.x, actualRotation.y - expectedRotation.y,
        );
        const rotationDistanceError = Math.abs(Math.hypot(
          actualRotation.x - top.x, actualRotation.y - top.y,
        ) - 24);
        const handleSizeError = Math.max(...[...handleRects, rotationRect]
          .flatMap((rect) => [Math.abs(rect.width - 8), Math.abs(rect.height - 8)]));
        return {
          error,
          handleError: Math.max(handlePositionError, rotationError, rotationDistanceError, handleSizeError),
        };
      };
      const spaceChecks = [];
      const staticSpaceSvg = mount.querySelector('[data-ppt-layer="static"] svg');
      for (const zoom of [0.5, 1, 2]) {
        for (const record of spaceRecords) spaceChecks.push(frameError(record, zoom));
      }
      const spaceError = Math.max(...spaceChecks.map((result) => result.error));
      const handleError = Math.max(...spaceChecks.map((result) => result.handleError));
      if (spaceError > 0.5 || handleError > 0.5
        || mount.querySelector('[data-ppt-layer="static"] svg') !== staticSpaceSvg) {
        throw new Error(`选择框矩阵偏差 ${spaceError.toFixed(3)}px，手柄尺寸偏差 ${handleError.toFixed(3)}px`);
      }
      spaceView.setZoom(0.5);
      spaceSession.editor.select({ kind: 'elements', ids: [spaceRecords[0].id], enteredGroup: null });
      const firstFrame = mount.querySelector('[data-edit-selection-frame]');
      const secondSpaceView = spaceSession.mount(ownedMount, { mode: 'edit', textMode: 'svg', zoom: 2 });
      const secondFrame = ownedMount.querySelector('[data-edit-selection-frame]');
      const firstWidth = Number(mount.querySelector('[data-edit-handle="nw"]')?.getAttribute('width'));
      const secondWidth = Number(ownedMount.querySelector('[data-edit-handle="nw"]')?.getAttribute('width'));
      if (firstFrame === secondFrame || firstWidth !== 16 || secondWidth !== 4) {
        throw new Error(`多视图手柄未隔离：${firstWidth}/${secondWidth}`);
      }
      secondSpaceView.destroy();
      spaceView.setMode('view');
      if (getComputedStyle(mount.querySelector('[data-ppt-layer="interaction"]')).display !== 'none') {
        throw new Error('查看模式不应显示选择框手柄');
      }
      spaceView.setMode('edit');

      const fontSession = await openEditor(await load('sample-embedfont.pptx'), { idPrefix: 'browser-font-' });
      fontSession.mount(fontMount, { mode: 'view' });
      const fontFaces = (fontMount.innerHTML.match(/@font-face/g) ?? []).length;
      if (fontFaces < 3 || !fontMount.innerHTML.includes('src:url(blob:')) {
        throw new Error(`嵌入字体没有进入源 Presentation 的 SVG：${fontFaces}`);
      }

      const perfSession = await openEditor(await load('sample-editor-60.pptx'), { idPrefix: 'browser-perf-' });
      const perfView = perfSession.mount(perfMount);
      const perfRoots = perfSession.editor.doc.slides[perfView.slideId].children;
      const perfTarget = perfRoots[0];
      const sourceX = perfSession.editor.doc.elements[perfTarget].src.x;
      const samples = [];
      for (let index = 0; index < 80; index++) {
        const started = performance.now();
        perfSession.editor.exec({ type: 'SetXfrm', id: perfTarget, x: sourceX + index % 2 + 1 });
        samples.push(performance.now() - started);
      }
      samples.sort((left, right) => left - right);
      const p95 = samples[Math.floor(samples.length * 0.95)];
      if (perfRoots.length !== 60 || p95 > 16) throw new Error(`60 元素提交 p95 ${p95.toFixed(3)}ms`);

      const selectionSamples = [];
      const perfStaticSvg = perfMount.querySelector('[data-ppt-layer="static"] svg');
      for (let index = 0; index < 80; index++) {
        const started = performance.now();
        perfSession.editor.select({
          kind: 'elements', ids: [perfRoots[index % 2]], enteredGroup: null,
        });
        selectionSamples.push(performance.now() - started);
      }
      selectionSamples.sort((left, right) => left - right);
      const selectionP95 = selectionSamples[Math.floor(selectionSamples.length * 0.95)];
      if (selectionP95 > 8 || perfMount.querySelectorAll('[data-edit-handle]').length !== 9
        || perfMount.querySelector('[data-ppt-layer="static"] svg') !== perfStaticSvg) {
        throw new Error(`60 元素完整选择框反馈 p95 ${selectionP95.toFixed(3)}ms`);
      }

      report.dataset.status = 'pass';
      report.dataset.p95 = p95.toFixed(3);
      report.dataset.hitP95 = hitP95.toFixed(3);
      report.dataset.selectionP95 = selectionP95.toFixed(3);
      report.dataset.spaceError = spaceError.toFixed(3);
      report.dataset.handleError = handleError.toFixed(3);
      report.dataset.fontFaces = String(fontFaces);
      report.textContent = `PASS\n实心/描边/重叠/嵌套组原生命中，Alt z 序循环\n`
        + `查看模式与多视图销毁通过\n点选反馈 p95 ${hitP95.toFixed(3)}ms\n`
        + `三档缩放 OBB / 手柄最大偏差 ${spaceError.toFixed(3)} / ${handleError.toFixed(3)}px\n`
        + `${fontFaces} 个嵌入 @font-face\n60 元素提交 p95 ${p95.toFixed(3)}ms\n`
        + `60 元素完整选择框 p95 ${selectionP95.toFixed(3)}ms`;
      globalThis.editorContract = { session, hitSession, spaceSession, spaceView, fontSession, perfSession };
    } catch (error) {
      report.style.color = '#b91c1c';
      report.dataset.status = 'fail';
      report.textContent = `FAIL\n${error instanceof Error ? error.stack : String(error)}`;
      throw error;
    }
  </script>
</body>
</html>
