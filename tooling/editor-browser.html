<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Web-PPT Editor Browser Contract</title>
  <style>
    body { margin: 0; padding: 20px; font: 14px system-ui; background: #eef2f7; }
    #mount { width: 960px; height: 540px; overflow: hidden; background: white; box-shadow: 0 8px 30px #1e293b30; }
    #mount [data-ppt-stage] { transform-origin: 0 0; }
    .contract-offscreen { position: absolute; left: -10000px; top: 0; width: 1280px; height: 720px; }
    #report { white-space: pre-wrap; color: #166534; }
  </style>
</head>
<body>
  <h1>Web-PPT Editor Browser Contract</h1>
  <pre id="report" role="status">RUNNING</pre>
  <div id="mount"></div>
  <div id="font-mount" class="contract-offscreen"></div>
  <div id="perf-mount" class="contract-offscreen"></div>
  <div id="owned-mount" class="contract-offscreen"></div>
  <script type="module">
    import { openEditor } from '/out/editor/editor.mjs';
    import { runEditorResizeBrowserContract } from '/tooling/lib/editor-resize-browser-contract.mjs';
    import { runEditorRotationBrowserContract } from '/tooling/lib/editor-rotation-browser-contract.mjs';
    import { runEditorSnapBrowserContract } from '/tooling/lib/editor-snap-browser-contract.mjs';
    import { runEditorMarqueeBrowserContract } from '/tooling/lib/editor-marquee-browser-contract.mjs';
    import { runEditorKeyboardBrowserContract } from '/tooling/lib/editor-keyboard-browser-contract.mjs';
    import { runEditorHistoryBrowserContract } from '/tooling/lib/editor-history-browser-contract.mjs';
    import { runEditorDeleteBrowserContract } from '/tooling/lib/editor-delete-browser-contract.mjs';
    import { runEditorLayerBrowserContract } from '/tooling/lib/editor-layer-browser-contract.mjs';
    import { runEditorAlignBrowserContract } from '/tooling/lib/editor-align-browser-contract.mjs';
    import { runEditorTabBrowserContract } from '/tooling/lib/editor-tab-browser-contract.mjs';
    import { runEditorMultiselectBrowserContract } from '/tooling/lib/editor-multiselect-browser-contract.mjs';
    import { runEditorClipboardBrowserContract } from '/tooling/lib/editor-clipboard-browser-contract.mjs';

    const report = document.querySelector('#report');
    const mount = document.querySelector('#mount');
    const fontMount = document.querySelector('#font-mount');
    const perfMount = document.querySelector('#perf-mount');
    const ownedMount = document.querySelector('#owned-mount');
    const load = async (name) => {
      const response = await fetch(`/fixtures/${name}`);
      if (!response.ok) throw new Error(`${name} HTTP ${response.status}`);
      return response.arrayBuffer();
    };
    try {
      const session = await openEditor(await load('sample-edit-basic.pptx'), { idPrefix: 'browser-contract-' });
      const view = session.mount(mount, { mode: 'edit', zoom: 0.75 });
      const staticLayer = mount.querySelector('[data-ppt-layer="static"]');
      const roots = session.editor.doc.slides[view.slideId].children;
      const [targetId, siblingId] = roots;
      const targetBefore = staticLayer.querySelector(`[data-edit-id="${targetId}"]`);
      const siblingBefore = staticLayer.querySelector(`[data-edit-id="${siblingId}"]`);
      const svgBefore = staticLayer.querySelector('svg');
      session.editor.exec({
        type: 'SetXfrm', id: targetId, x: session.editor.doc.elements[targetId].src.x + 20,
      });
      const ok = mount.querySelectorAll('[data-ppt-layer]').length === 3
        && staticLayer.querySelector(`[data-edit-id="${targetId}"]`) !== targetBefore
        && staticLayer.querySelector(`[data-edit-id="${siblingId}"]`) === siblingBefore
        && staticLayer.querySelector('svg') === svgBefore
        && staticLayer.querySelector('image')?.getAttribute('href')?.startsWith('blob:');
      if (!ok) throw new Error('三层、增量 DOM 身份或图片资源断言失败');

      view.destroy();
      const hitSession = await openEditor(await load('sample-editor-hit.pptx'), { idPrefix: 'browser-hit-' });
      const hitView = hitSession.mount(mount, { mode: 'edit', zoom: 0.75, textMode: 'svg' });
      mount.scrollIntoView({ block: 'start' });
      const byName = (name) => Object.values(hitSession.editor.doc.elements)
        .find((record) => record.src.name === name)?.id;
      const ids = {
        solid: byName('hit-solid'), outline: byName('hit-outline'),
        lower: byName('hit-overlap-lower'), upper: byName('hit-overlap-upper'),
        outer: byName('hit-outer-group'), inner: byName('hit-inner-group'), leaf: byName('hit-nested-leaf'),
      };
      if (Object.values(ids).some((id) => !id)) throw new Error('命中固件缺少稳定元素');
      const hitAt = (x, y, init = {}) => {
        const rect = mount.getBoundingClientRect();
        const clientX = rect.left + x * 0.75;
        const clientY = rect.top + y * 0.75;
        const target = document.elementFromPoint(clientX, clientY);
        if (!target) throw new Error(`命中点落在视口外：${x},${y}`);
        const accepted = target.dispatchEvent(new PointerEvent('pointerdown', {
          bubbles: true, composed: true, cancelable: true, pointerType: 'mouse', isPrimary: true, button: 0,
          clientX, clientY, ...init,
        }));
        target.dispatchEvent(new PointerEvent('pointerup', {
          bubbles: true, composed: true, cancelable: true, pointerType: 'mouse', isPrimary: true, button: 0,
          clientX, clientY, ...init,
        }));
        return { target, accepted, clientX, clientY };
      };
      const selected = (id, enteredGroup = null) => hitSession.editor.selection.kind === 'elements'
        && hitSession.editor.selection.ids[0] === id
        && hitSession.editor.selection.enteredGroup === enteredGroup;

      hitAt(190, 170);
      if (!selected(ids.solid)) throw new Error('实心 SVG 原生命中失败');
      hitSession.editor.select({ kind: 'none' });
      hitAt(470, 170);
      if (hitSession.editor.selection.kind !== 'none') throw new Error('无填充形状的中心不应命中');
      hitAt(363, 170);
      if (!selected(ids.outline)) throw new Error('无填充形状的描边应可命中');
      hitAt(820, 190);
      if (!selected(ids.upper)) throw new Error('重叠形状未选中最上层');
      hitAt(820, 190, { altKey: true });
      const altReachedLower = selected(ids.lower);
      hitAt(820, 190, { altKey: true });
      if (!altReachedLower || !selected(ids.upper)) throw new Error('Alt 未按浏览器 z 序循环');

      const nestedHit = hitAt(250, 470);
      if (!selected(ids.outer)) throw new Error('组内点选未默认选外层组');
      nestedHit.target.dispatchEvent(new MouseEvent('dblclick', {
        bubbles: true, composed: true, cancelable: true,
        clientX: nestedHit.clientX, clientY: nestedHit.clientY,
      }));
      if (!selected(ids.inner, ids.outer)) throw new Error('双击未进入外层组');
      nestedHit.target.dispatchEvent(new MouseEvent('dblclick', {
        bubbles: true, composed: true, cancelable: true,
        clientX: nestedHit.clientX, clientY: nestedHit.clientY,
      }));
      if (!selected(ids.leaf, ids.inner)) throw new Error('双击未逐层进入内层组');
      hitView.element.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      if (!selected(ids.inner, ids.outer)) throw new Error('Escape 未逐层退出内层组');

      hitSession.editor.select({ kind: 'elements', ids: [ids.upper], enteredGroup: null });
      hitView.setMode('view');
      const viewEvent = hitAt(190, 170);
      if (!viewEvent.accepted || !selected(ids.upper)) throw new Error('查看模式不应拦截或修改选区');
      hitView.setMode('edit');

      const ownedView = hitSession.mount(ownedMount, { mode: 'edit', textMode: 'svg' });
      const ownedTarget = ownedMount.querySelector(`[data-edit-id="${ids.solid}"]`);
      hitSession.editor.select({ kind: 'none' });
      ownedTarget.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, composed: true, isPrimary: true,
      }));
      ownedTarget.dispatchEvent(new PointerEvent('pointerup', {
        bubbles: true, composed: true, isPrimary: true,
      }));
      if (!selected(ids.solid)) throw new Error('共享会话的第二视图未提交选区');
      ownedView.destroy();
      document.body.append(ownedView.element);
      hitSession.editor.select({ kind: 'none' });
      ownedTarget.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true, composed: true, isPrimary: true,
      }));
      ownedTarget.dispatchEvent(new PointerEvent('pointerup', {
        bubbles: true, composed: true, isPrimary: true,
      }));
      if (hitSession.editor.selection.kind !== 'none') throw new Error('已销毁视图仍然响应选择事件');
      ownedView.element.remove();

      const hitSamples = [];
      for (let index = 0; index < 80; index++) {
        const started = performance.now();
        hitAt(index % 2 ? 363 : 190, 170);
        hitSamples.push(performance.now() - started);
      }
      hitSamples.sort((left, right) => left - right);
      const hitP95 = hitSamples[Math.floor(hitSamples.length * 0.95)];
      if (hitP95 > 8) throw new Error(`点选反馈 p95 ${hitP95.toFixed(3)}ms`);

      hitView.destroy();
      const spaceSession = await openEditor(await load('sample-editor-space.pptx'), { idPrefix: 'browser-space-' });
      const spaceView = spaceSession.mount(mount, { mode: 'edit', textMode: 'svg', snapping: false });
      const spaceByName = (name) => Object.values(spaceSession.editor.doc.elements)
        .find((record) => record.src.name === name);
      const spaceRecords = [
        spaceByName('space-plain'),
        spaceByName('space-rotated-flipped'),
        spaceByName('space-nested-leaf'),
      ];
      if (spaceRecords.some((record) => !record)) throw new Error('坐标固件缺少稳定元素');
      const polygonPoints = (polygon) => polygon.getAttribute('points').trim().split(/\s+/).map((pair) => {
        const [x, y] = pair.split(',').map(Number);
        return new DOMPoint(x, y);
      });
      const screenPoint = (point, matrix) => point.matrixTransform(matrix);
      const midpoint = (left, right) => new DOMPoint((left.x + right.x) / 2, (left.y + right.y) / 2);
      const frameError = (record, zoom) => {
        spaceView.setZoom(zoom);
        spaceSession.editor.select({ kind: 'elements', ids: [record.id], enteredGroup: null });
        const target = mount.querySelector(`[data-edit-id="${record.id}"]`);
        const base = target?.querySelector(':scope > g[transform]');
        const polygon = mount.querySelector('[data-edit-selection-frame]');
        const handle = mount.querySelector('[data-edit-handle="nw"]');
        const targetMatrix = base?.getScreenCTM();
        const overlayMatrix = polygon?.getScreenCTM();
        if (!targetMatrix || !overlayMatrix || !handle) throw new Error(`无法取得 ${record.src.name} 的屏幕矩阵`);
        const expected = [
          new DOMPoint(0, 0), new DOMPoint(record.src.w, 0),
          new DOMPoint(record.src.w, record.src.h), new DOMPoint(0, record.src.h),
        ].map((point) => screenPoint(point, targetMatrix));
        const actual = polygonPoints(polygon).map((point) => screenPoint(point, overlayMatrix));
        const error = Math.max(...actual.map((point, index) =>
          Math.hypot(point.x - expected[index].x, point.y - expected[index].y)));
        const [nw, ne, se, sw] = expected;
        const expectedScaleHandles = [
          nw, midpoint(nw, ne), ne, midpoint(ne, se), se, midpoint(se, sw), sw, midpoint(sw, nw),
        ];
        const handleNames = ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'];
        const handleRects = handleNames.map((name) =>
          mount.querySelector(`[data-edit-handle="${name}"]`).getBoundingClientRect());
        const handlePositionError = Math.max(...handleRects.map((rect, index) => Math.hypot(
          rect.left + rect.width / 2 - expectedScaleHandles[index].x,
          rect.top + rect.height / 2 - expectedScaleHandles[index].y,
        )));
        const top = midpoint(nw, ne);
        const center = midpoint(nw, se);
        const outwardX = top.x - center.x;
        const outwardY = top.y - center.y;
        const outwardLength = Math.hypot(outwardX, outwardY);
        const expectedRotation = new DOMPoint(
          top.x + outwardX / outwardLength * 24,
          top.y + outwardY / outwardLength * 24,
        );
        const rotationRect = mount.querySelector('[data-edit-handle="rotate"]').getBoundingClientRect();
        const actualRotation = new DOMPoint(
          rotationRect.left + rotationRect.width / 2,
          rotationRect.top + rotationRect.height / 2,
        );
        const rotationError = Math.hypot(
          actualRotation.x - expectedRotation.x, actualRotation.y - expectedRotation.y,
        );
        const rotationDistanceError = Math.abs(Math.hypot(
          actualRotation.x - top.x, actualRotation.y - top.y,
        ) - 24);
        const handleSizeError = Math.max(...[...handleRects, rotationRect]
          .flatMap((rect) => [Math.abs(rect.width - 8), Math.abs(rect.height - 8)]));
        return {
          error,
          handleError: Math.max(handlePositionError, rotationError, rotationDistanceError, handleSizeError),
        };
      };
      const spaceChecks = [];
      const staticSpaceSvg = mount.querySelector('[data-ppt-layer="static"] svg');
      for (const zoom of [0.5, 1, 2]) {
        for (const record of spaceRecords) spaceChecks.push(frameError(record, zoom));
      }
      const spaceError = Math.max(...spaceChecks.map((result) => result.error));
      const handleError = Math.max(...spaceChecks.map((result) => result.handleError));
      if (spaceError > 0.5 || handleError > 0.5
        || mount.querySelector('[data-ppt-layer="static"] svg') !== staticSpaceSvg) {
        throw new Error(`选择框矩阵偏差 ${spaceError.toFixed(3)}px，手柄尺寸偏差 ${handleError.toFixed(3)}px`);
      }
      spaceView.setZoom(0.5);
      spaceSession.editor.select({ kind: 'elements', ids: [spaceRecords[0].id], enteredGroup: null });
      const firstFrame = mount.querySelector('[data-edit-selection-frame]');
      const secondSpaceView = spaceSession.mount(ownedMount, { mode: 'edit', textMode: 'svg', zoom: 2 });
      const secondFrame = ownedMount.querySelector('[data-edit-selection-frame]');
      const firstWidth = Number(mount.querySelector('[data-edit-handle="nw"]')?.getAttribute('width'));
      const secondWidth = Number(ownedMount.querySelector('[data-edit-handle="nw"]')?.getAttribute('width'));
      if (firstFrame === secondFrame || firstWidth !== 16 || secondWidth !== 4) {
        throw new Error(`多视图手柄未隔离：${firstWidth}/${secondWidth}`);
      }
      secondSpaceView.destroy();
      spaceView.setMode('view');
      if (getComputedStyle(mount.querySelector('[data-ppt-layer="interaction"]')).display !== 'none') {
        throw new Error('查看模式不应显示选择框手柄');
      }
      spaceView.setMode('edit');

      spaceView.setZoom(1);
      const nestedRecord = spaceRecords[2];
      spaceSession.editor.select({
        kind: 'elements', ids: [nestedRecord.id], enteredGroup: nestedRecord.parent,
      });
      const nestedTarget = mount.querySelector(`[data-edit-id="${nestedRecord.id}"]`);
      const nestedBefore = nestedTarget.getBoundingClientRect();
      const nestedStart = {
        x: nestedBefore.left + nestedBefore.width / 2,
        y: nestedBefore.top + nestedBefore.height / 2,
      };
      const nestedPointer = (type, x, y) => new PointerEvent(type, {
        bubbles: true, composed: true, cancelable: true, pointerType: 'mouse', pointerId: 72, isPrimary: true,
        button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x, clientY: y,
      });
      nestedTarget.dispatchEvent(nestedPointer('pointerdown', nestedStart.x, nestedStart.y));
      spaceView.element.dispatchEvent(nestedPointer('pointermove', nestedStart.x + 40, nestedStart.y + 20));
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const nestedDuring = nestedTarget.getBoundingClientRect();
      const nestedDragError = Math.hypot(
        nestedDuring.left - nestedBefore.left - 40,
        nestedDuring.top - nestedBefore.top - 20,
      );
      if (nestedDragError > 0.5 || mount.querySelector(`[data-edit-id="${nestedRecord.id}"]`) !== nestedTarget
        || !mount.querySelector('[data-edit-drag-ghost]')
        || spaceSession.editor.effectiveElement(nestedRecord.id).x !== nestedRecord.src.x) {
        throw new Error(`嵌套组拖动幽灵屏幕偏差 ${nestedDragError.toFixed(3)}px`);
      }
      spaceView.element.dispatchEvent(nestedPointer('pointerup', nestedStart.x + 40, nestedStart.y + 20));
      const nestedCommitted = spaceSession.editor.effectiveElement(nestedRecord.id);
      if (Math.abs(nestedCommitted.x - 18.839745962155604) > 1e-6
        || Math.abs(nestedCommitted.y - 20.669872981077802) > 1e-6
        || spaceSession.editor.history.undoCount !== 1) {
        throw new Error('嵌套组拖动没有单次提交父空间坐标');
      }
      spaceSession.editor.undo();

      const fontSession = await openEditor(await load('sample-embedfont.pptx'), { idPrefix: 'browser-font-' });
      fontSession.mount(fontMount, { mode: 'view' });
      const fontFaces = (fontMount.innerHTML.match(/@font-face/g) ?? []).length;
      if (fontFaces < 3 || !fontMount.innerHTML.includes('src:url(blob:')) {
        throw new Error(`嵌入字体没有进入源 Presentation 的 SVG：${fontFaces}`);
      }

      const perfSession = await openEditor(await load('sample-editor-60.pptx'), { idPrefix: 'browser-perf-' });
      const perfView = perfSession.mount(perfMount, { snapping: false });
      const perfRoots = perfSession.editor.doc.slides[perfView.slideId].children;
      const perfTarget = perfRoots[0];
      const sourceX = perfSession.editor.doc.elements[perfTarget].src.x;
      const samples = [];
      for (let index = 0; index < 80; index++) {
        const started = performance.now();
        perfSession.editor.exec({ type: 'SetXfrm', id: perfTarget, x: sourceX + index % 2 + 1 });
        samples.push(performance.now() - started);
      }
      samples.sort((left, right) => left - right);
      const p95 = samples[Math.floor(samples.length * 0.95)];
      if (perfRoots.length !== 60 || p95 > 16) throw new Error(`60 元素提交 p95 ${p95.toFixed(3)}ms`);

      const selectionSamples = [];
      const perfStaticSvg = perfMount.querySelector('[data-ppt-layer="static"] svg');
      for (let index = 0; index < 80; index++) {
        const started = performance.now();
        perfSession.editor.select({
          kind: 'elements', ids: [perfRoots[index % 2]], enteredGroup: null,
        });
        selectionSamples.push(performance.now() - started);
      }
      selectionSamples.sort((left, right) => left - right);
      const selectionP95 = selectionSamples[Math.floor(selectionSamples.length * 0.95)];
      if (selectionP95 > 8 || perfMount.querySelectorAll('[data-edit-handle]').length !== 9
        || perfMount.querySelector('[data-ppt-layer="static"] svg') !== perfStaticSvg) {
        throw new Error(`60 元素完整选择框反馈 p95 ${selectionP95.toFixed(3)}ms`);
      }

      const dragTarget = perfMount.querySelector(`[data-edit-id="${perfTarget}"]`);
      const dragSibling = perfMount.querySelector(`[data-edit-id="${perfRoots[1]}"]`);
      const dragTargetBefore = dragTarget;
      const dragStaticSvg = perfMount.querySelector('[data-ppt-layer="static"] svg');
      const dragDefs = dragStaticSvg.querySelector('defs');
      const dragSource = perfSession.editor.effectiveElement(perfTarget);
      const dragHistoryBefore = perfSession.editor.history.undoCount;
      const pendingFrames = new Map();
      let frameSerial = 0;
      const requestFrame = window.requestAnimationFrame;
      const cancelFrame = window.cancelAnimationFrame;
      window.requestAnimationFrame = (callback) => {
        const id = ++frameSerial;
        pendingFrames.set(id, callback);
        return id;
      };
      window.cancelAnimationFrame = (id) => pendingFrames.delete(id);
      const dragPointer = (type, x, y) => new PointerEvent(type, {
        bubbles: true, composed: true, cancelable: true, pointerType: 'mouse', pointerId: 71, isPrimary: true,
        button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x, clientY: y,
      });
      const flushDragFrame = () => {
        const next = pendingFrames.entries().next().value;
        if (!next || pendingFrames.size !== 1) throw new Error(`拖动帧队列失控：${pendingFrames.size}`);
        pendingFrames.delete(next[0]);
        const started = performance.now();
        next[1](started);
        return performance.now() - started;
      };
      const dragSamples = [];
      let dragDuring;
      let dragEnd = { x: 14, y: 10 };
      try {
        dragTarget.dispatchEvent(dragPointer('pointerdown', 10, 10));
        perfView.element.dispatchEvent(dragPointer('pointermove', dragEnd.x, dragEnd.y));
        dragSamples.push(flushDragFrame());
        dragDuring = perfMount.querySelector('[data-edit-drag-ghost]')
          && perfMount.querySelector(`[data-edit-id="${perfTarget}"]`) === dragTargetBefore
          && perfMount.querySelector('[data-ppt-layer="static"] svg') === dragStaticSvg
          && dragStaticSvg.querySelector('defs') === dragDefs
          && perfSession.editor.effectiveElement(perfTarget).x === dragSource.x;
        for (let index = 0; index < 80; index++) {
          dragEnd = { x: 30 + index % 2, y: 24 + index % 3 };
          perfView.element.dispatchEvent(dragPointer('pointermove', dragEnd.x, dragEnd.y));
          dragSamples.push(flushDragFrame());
        }
        perfView.element.dispatchEvent(dragPointer('pointerup', dragEnd.x, dragEnd.y));
      } finally {
        window.requestAnimationFrame = requestFrame;
        window.cancelAnimationFrame = cancelFrame;
      }
      dragSamples.sort((left, right) => left - right);
      const dragP95 = dragSamples[Math.floor(dragSamples.length * 0.95)];
      const dragMoved = perfSession.editor.effectiveElement(perfTarget);
      if (!dragDuring || dragP95 > 8
        || Math.abs(dragMoved.x - (dragSource.x + dragEnd.x - 10)) > 1e-6
        || Math.abs(dragMoved.y - (dragSource.y + dragEnd.y - 10)) > 1e-6
        || perfSession.editor.history.undoCount !== dragHistoryBefore + 1
        || perfMount.querySelector('[data-edit-drag-ghost]')
        || perfMount.querySelector(`[data-edit-id="${perfTarget}"]`) === dragTargetBefore
        || perfMount.querySelector(`[data-edit-id="${perfRoots[1]}"]`) !== dragSibling
        || perfMount.querySelector('[data-ppt-layer="static"] svg') !== dragStaticSvg
        || dragStaticSvg.querySelector('defs') !== dragDefs) {
        throw new Error(`60 元素拖动帧 p95 ${dragP95.toFixed(3)}ms`);
      }
      perfSession.editor.undo();
      if (Math.abs(perfSession.editor.effectiveElement(perfTarget).x - dragSource.x) > 1e-6) {
        throw new Error('Chrome 拖动撤销未恢复源位置');
      }

      const resizeResult = await runEditorResizeBrowserContract({ openEditor, load });
      const rotationResult = await runEditorRotationBrowserContract({ openEditor, load });
      const snapResult = await runEditorSnapBrowserContract({ openEditor, load });
      const marqueeResult = await runEditorMarqueeBrowserContract({ openEditor, load });
      const keyboardResult = await runEditorKeyboardBrowserContract({ openEditor, load });
      const historyResult = await runEditorHistoryBrowserContract({ openEditor, load });
      const deleteResult = await runEditorDeleteBrowserContract({ openEditor, load });
      const layerResult = await runEditorLayerBrowserContract({ openEditor, load });
      const alignResult = await runEditorAlignBrowserContract({ openEditor, load });
      const tabP95 = await runEditorTabBrowserContract({ openEditor, load });
      const multiselectResult = await runEditorMultiselectBrowserContract({ openEditor, load });
      const clipboardResult = await runEditorClipboardBrowserContract({ openEditor, load });
      const trustedSnapSession = await openEditor(await load('sample-editor-snap.pptx'), {
        idPrefix: 'browser-trusted-snap-',
      });
      const trustedMarqueeSession = await openEditor(await load('sample-editor-marquee.pptx'), {
        idPrefix: 'browser-trusted-marquee-',
      });
      const trustedLayerSession = await openEditor(await load('sample-editor-layer.pptx'), {
        idPrefix: 'browser-trusted-layer-',
      });

      report.dataset.status = 'pass';
      report.dataset.p95 = p95.toFixed(3);
      report.dataset.hitP95 = hitP95.toFixed(3);
      report.dataset.selectionP95 = selectionP95.toFixed(3);
      report.dataset.spaceError = spaceError.toFixed(3);
      report.dataset.handleError = handleError.toFixed(3);
      report.dataset.nestedDragError = nestedDragError.toFixed(3);
      report.dataset.dragP95 = dragP95.toFixed(3);
      report.dataset.resizeError = resizeResult.geometryError.toFixed(3);
      report.dataset.resizeHitError = resizeResult.hitSizeError.toFixed(3);
      report.dataset.resizeP95 = resizeResult.p95.toFixed(3);
      report.dataset.resizeSingularP95 = resizeResult.singularP95.toFixed(3);
      report.dataset.rotationNestedError = rotationResult.nestedError.toFixed(3);
      report.dataset.rotationMultiError = rotationResult.multiError.toFixed(3);
      report.dataset.rotationP95 = rotationResult.p95.toFixed(3);
      report.dataset.snapThresholdError = snapResult.thresholdError.toFixed(3);
      report.dataset.snapGroupError = snapResult.groupError.toFixed(3);
      report.dataset.snapSpacingError = snapResult.spacingError.toFixed(3);
      report.dataset.snapP95 = snapResult.p95.toFixed(3);
      report.dataset.marqueeError = marqueeResult.geometryError.toFixed(3);
      report.dataset.marqueeFirstFrame = marqueeResult.firstFrame.toFixed(3);
      report.dataset.marqueeP95 = marqueeResult.p95.toFixed(3);
      report.dataset.keyboardError = keyboardResult.geometryError.toFixed(3);
      report.dataset.keyboardP95 = keyboardResult.p95.toFixed(3);
      report.dataset.historyUndoP95 = historyResult.undoP95.toFixed(3);
      report.dataset.historyRedoP95 = historyResult.redoP95.toFixed(3);
      report.dataset.deleteP95 = deleteResult.deleteP95.toFixed(3);
      report.dataset.deleteUndoP95 = deleteResult.undoP95.toFixed(3);
      report.dataset.deleteRedoP95 = deleteResult.redoP95.toFixed(3);
      report.dataset.layerP95 = layerResult.layerP95.toFixed(3);
      report.dataset.layerUndoP95 = layerResult.undoP95.toFixed(3);
      report.dataset.layerRedoP95 = layerResult.redoP95.toFixed(3);
      report.dataset.alignError = alignResult.geometryError.toFixed(3);
      report.dataset.alignP95 = alignResult.p95.toFixed(3);
      report.dataset.tabP95 = tabP95.toFixed(3);
      report.dataset.multiselectClickP95 = multiselectResult.clickP95.toFixed(3);
      report.dataset.multiselectMarqueeP95 = multiselectResult.marqueeP95.toFixed(3);
      report.dataset.clipboardPaste = clipboardResult.pasteTime.toFixed(3);
      report.dataset.clipboardPasteP95 = clipboardResult.pasteP95.toFixed(3);
      report.dataset.fontFaces = String(fontFaces);
      report.textContent = `PASS\n实心/描边/重叠/嵌套组原生命中，Alt z 序循环\n`
        + `查看模式与多视图销毁通过\n点选反馈 p95 ${hitP95.toFixed(3)}ms\n`
        + `三档缩放 OBB / 手柄最大偏差 ${spaceError.toFixed(3)} / ${handleError.toFixed(3)}px\n`
        + `嵌套组拖动幽灵偏差 ${nestedDragError.toFixed(3)}px\n`
        + `${fontFaces} 个嵌入 @font-face\n60 元素提交 p95 ${p95.toFixed(3)}ms\n`
        + `60 元素完整选择框 p95 ${selectionP95.toFixed(3)}ms\n`
        + `60 元素拖动帧 p95 ${dragP95.toFixed(3)}ms\n`
        + `三档缩放手柄/锚点偏差 ${resizeResult.geometryError.toFixed(3)} / `
        + `${resizeResult.hitSizeError.toFixed(3)}px，缩放帧 p95 ${resizeResult.p95.toFixed(3)}ms\n`
        + `60 个 45° 元素近奇异缩放帧 p95 ${resizeResult.singularP95.toFixed(3)}ms`;
      report.textContent += `\n嵌套/多选旋转偏差 ${rotationResult.nestedError.toFixed(3)} / `
        + `${rotationResult.multiError.toFixed(3)}px，60 元素旋转帧 p95 ${rotationResult.p95.toFixed(3)}ms`;
      report.textContent += `\n三档缩放吸附/组内/等距参考线偏差 ${snapResult.thresholdError.toFixed(3)} / `
        + `${snapResult.groupError.toFixed(3)} / ${snapResult.spacingError.toFixed(3)}px，`
        + `60 元素吸附帧 p95 ${snapResult.p95.toFixed(3)}ms`;
      report.textContent += `\n三档缩放框选边界偏差 ${marqueeResult.geometryError.toFixed(3)}px，`
        + `60 元素框选首帧/p95 ${marqueeResult.firstFrame.toFixed(3)} / `
        + `${marqueeResult.p95.toFixed(3)}ms`;
      report.textContent += `\n三档缩放键盘微移偏差 ${keyboardResult.geometryError.toFixed(3)}px，`
        + `60 元素提交 p95 ${keyboardResult.p95.toFixed(3)}ms`;
      report.textContent += `\n60 元素撤销/重做 p95 ${historyResult.undoP95.toFixed(3)} / `
        + `${historyResult.redoP95.toFixed(3)}ms`;
      report.textContent += `\n旋转/组合视觉对齐偏差 ${alignResult.geometryError.toFixed(3)}px，`
        + `60 元素页 10 选对齐 p95 ${alignResult.p95.toFixed(3)}ms`;
      report.textContent += `\n60 元素 Tab 遍历 p95 ${tabP95.toFixed(3)}ms`;
      report.textContent += `\n元素剪贴板小批量粘贴 ${clipboardResult.pasteTime.toFixed(3)}ms`;
      report.textContent += `，60 元素 p95 ${clipboardResult.pasteP95.toFixed(3)}ms`;
      report.textContent += `\n60 元素修饰点选/框选 p95 ${multiselectResult.clickP95.toFixed(3)} / `
        + `${multiselectResult.marqueeP95.toFixed(3)}ms`;
      globalThis.editorContract = {
        session, hitSession, spaceSession, spaceView, fontSession, perfSession, trustedSnapSession,
        trustedMarqueeSession,
        trustedLayerSession,
      };
    } catch (error) {
      report.style.color = '#b91c1c';
      report.dataset.status = 'fail';
      report.textContent = `FAIL\n${error instanceof Error ? error.stack : String(error)}`;
      throw error;
    }
  </script>
</body>
