<tspan font-size="32" font-family="'Calibri','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" fill="rgb(31,56,100)" font-weight="700">行距 150% (spcPct) 与 24pt (spcPts) 对照</tspan>
