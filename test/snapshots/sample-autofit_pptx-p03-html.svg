<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" font-family="Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<defs>
</defs>
<rect width="1280" height="720" fill="rgb(255,255,255)"/>
<g data-el="107" style="transform-box:fill-box;transform-origin:center">
<g transform="translate(40 60)">
<path d="M 0 0 L 1200 0 L 1200 60 L 0 60 Z" fill="none" fill-rule="nonzero"/>
<foreignObject width="1200" height="60" style="overflow:visible">
<div xmlns="http://www.w3.org/1999/xhtml" style="width:1200px;height:60px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding:4.8px 9.6px 4.8px 9.6px;overflow:visible;">
<div style="margin:0px 0 0px 0;text-align:left;padding-left:0px;text-indent:0px;line-height:1.2;white-space:pre-wrap;word-break:break-word;">
<span style="font-size:32px;color:rgb(31,56,100);font-weight:700;font-family:'Calibri','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">溢出 + 无 autofit → 照常溢出</span>
</div>
</div>
</foreignObject>
</g>
</g>
<g data-el="108" style="transform-box:fill-box;transform-origin:center">
<g transform="translate(60 180)">
<path d="M 0 0 L 420 0 L 420 140 L 0 140 Z" fill="rgb(46,117,182)" fill-rule="nonzero"/>
<foreignObject width="420" height="140" style="overflow:visible">
<div xmlns="http://www.w3.org/1999/xhtml" style="width:420px;height:140px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;padding:4.8px 9.6px 4.8px 9.6px;overflow:visible;">
<div style="margin:0px 0 0px 0;text-align:left;padding-left:0px;text-indent:0px;line-height:1.2;white-space:pre-wrap;word-break:break-word;">
<span style="font-size:26.67px;color:rgb(0,0,0);font-family:'Calibri','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">自动缩放回归<span style="margin-right:-0.5em">：</span>这一段文字在给定的文本框里按标称字号排版必定溢出<span style="margin-right:-0.5em">，</span>渲染器应当自行计算缩放比例把它塞进框内<span style="margin-right:-0.5em">，</span>而不是让它溢出到版面之外<span style="margin-right:-0.5em">。</span>真实演讲文件里大量文本框只写了裸的 normAutofit 而不带 fontScale<span style="margin-right:-0.5em">，</span>PowerPoint 与 LibreOffice 都会自行计算缩放<span style="margin-right:-0.5em">；</span>若照标称字号渲染<span style="margin-right:-0.5em">，</span>整段文字会盖住下方内容甚至跑出版面<span style="margin-right:-0.5em">。</span>
</span>
</div>
</div>
</foreignObject>
</g>
</g>
<g data-el="109" style="transform-box:fill-box;transform-origin:center">
<g transform="translate(520 180)">
<path d="M 0 0 L 400 0 L 400 140 L 0 140 Z" fill="none" fill-rule="nonzero"/>
<foreignObject width="400" height="140" style="overflow:visible">
<div xmlns="http://www.w3.org/1999/xhtml" style="width:400px;height:140px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;padding:4.8px 9.6px 4.8px 9.6px;overflow:visible;">
<div style="margin:0px 0 0px 0;text-align:center;padding-left:0px;text-indent:0px;line-height:1.2;white-space:pre-wrap;word-break:break-word;">
<span style="font-size:12px;color:rgb(96,96,96);font-family:'Calibri','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">左侧框 420×140，标称 20pt</span>
</div>
</div>
</foreignObject>
</g>
</g>
</svg>