name: 发布

# 打 tag 触发：git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC 换取短期发布令牌所必需，缺了会退回要 NPM_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 Node ≥ 22.14.0
          node-version: 22
          cache: npm
          # 刻意不设 registry-url：它会写一个带 _authToken=${NODE_AUTH_TOKEN}
          # 的 .npmrc，而该变量为空，npm 会拿着空凭据去发布 —— scoped 包
          # 在无凭据时返回的是 404 而不是 401，极难排查。OIDC 自己会认 registry。

      - name: 升级 npm
        # Trusted Publishing 要求 npm ≥ 11.5.1。钉在 11.x：npm 12 刚发布，
        # 实测 12.0.2 在环境完全达标（id-token 已注入、无任何 auth 配置）时
        # 仍直接报 ENEEDAUTH，根本不发起 OIDC 交换。
        run: npm i -g npm@^11.5.1

      - name: OIDC 环境自检
        run: |
          echo "npm  $(npm --version)   node $(node --version)"
          echo "id-token 端点: ${ACTIONS_ID_TOKEN_REQUEST_URL:+已注入}${ACTIONS_ID_TOKEN_REQUEST_URL:-缺失（检查 permissions.id-token）}" # 只打是否存在，URL 本身不必进公开日志
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:+非空}${NODE_AUTH_TOKEN:-未设置（符合预期）}"
          echo "生效的 .npmrc:"; npm config list | sed -E 's#(_authToken *= *).*#\1<隐去>#'

      - run: npm ci

      - name: 校验 tag 与包版本一致
        # tag 与 package.json 对不上时，发出去的版本号会让人迷惑，不如直接失败
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/core packages/edit-core packages/viewer-core packages/editor packages/react packages/vue packages/fonts; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "::error::$p 版本 $v 与 tag $tag 不一致"; exit 1; }
          done
          echo "tag $tag 与七个包版本一致"

      - name: 类型检查
        run: npm run check

      - name: 校验 npm 首发引导已完成
        # npm 只允许“已存在的包”配置 Trusted Publishing。缺包时在耗时测试前给出
        # 可执行原因，避免最后一个 publish 才用误导性的 scoped 404 失败。
        run: |
          missing=()
          for p in packages/core packages/edit-core packages/viewer-core packages/editor packages/react packages/vue packages/fonts; do
            name=$(node -p "require('./$p/package.json').name")
            npm view "$name" name >/dev/null 2>&1 || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::以下包尚不存在，须按 AGENTS.md 在本地完成第一次 npm publish，再配置 Trusted Publishing：${missing[*]}"
            exit 1
          fi

      - name: 重新生成测试文件
        run: npm run fixtures

      - name: 核心解析 / 渲染测试
        run: npm run test:core

      - name: 编辑模型 / 投影测试
        run: npm run test:edit

      - name: 浏览器 DOM 编辑层测试
        run: npm run test:editor

      - name: React / Vue 适配与体积门禁
        run: npm run test:adapters

      - name: 编辑性能预算
        run: npm run bench:edit

      - name: 图元文件解码测试
        run: npm run test:metafile

      # 各包的 prepublishOnly 会跑一次 build，这里先构建一遍是为了
      # 万一构建失败，能在动 registry 之前就失败掉
      - name: 构建
        run: npm run build

      # 顺序不能反：editor 同时依赖 core、edit-core 与 viewer-core，其余包也以 core 为 peer 依赖。
      # 在包目录内发布而非用 -w：OIDC 需要按包换取令牌，workspace 路径下
      # 是否走同一条代码路径没有保证，进包目录是文档示例里的形态。
      #
      # 每步先查 registry 上有没有这个版本，有就跳过。发布是七步串行的，
      # 中间任一步挂掉都得重跑整个 job，没有这层守卫，前面已发成功的包会以
      # EPUBLISHCONFLICT 把重跑再次弄红，真正的失败原因反而被埋掉。
      # 新包第一版在本地手工发过的情况同理。
      - name: 发布 @web-ppt/core
        working-directory: packages/core
        run: bash ../../tooling/publish-if-new.sh

      # 新包第一版仍须按仓库 AGENTS 的说明手工引导发布并配置 Trusted Publishing；
      # registry 已存在后，后续版本才由这里接管。
      - name: 发布 @web-ppt/edit-core
        working-directory: packages/edit-core
        run: bash ../../tooling/publish-if-new.sh

      - name: 发布 @web-ppt/viewer-core
        working-directory: packages/viewer-core
        run: bash ../../tooling/publish-if-new.sh

      - name: 发布 @web-ppt/editor
        working-directory: packages/editor
        run: bash ../../tooling/publish-if-new.sh

      # react/vue 只依赖已发布的 editor 与各自 optional peer，因此必须排在 editor 后面。
      # 两个新包的第一版仍须本地手工发布，再到 npm 配好 Trusted Publishing。
      - name: 发布 @web-ppt/react
        working-directory: packages/react
        run: bash ../../tooling/publish-if-new.sh

      - name: 发布 @web-ppt/vue
        working-directory: packages/vue
        run: bash ../../tooling/publish-if-new.sh

      # 注意：npm 要求包已存在才能配置 Trusted Publishing，所以**新包的第一版
      # 走不了 OIDC**（scoped 包在无凭据时返回的是 404，不是 401，极难排查）。
      # 新增包时先在本地 npm publish 发一版，再去 npm 包设置里配好
      # trusted publisher，之后这一步才会通。
      - name: 发布 @web-ppt/fonts
        working-directory: packages/fonts
        run: bash ../../tooling/publish-if-new.sh
