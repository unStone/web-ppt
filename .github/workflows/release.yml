name: 发布

# 打 tag 触发：git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC 换取短期发布令牌所必需，缺了会退回要 NPM_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 Node ≥ 22.14.0
          node-version: 22
          cache: npm
          # 刻意不设 registry-url：它会写一个带 _authToken=${NODE_AUTH_TOKEN}
          # 的 .npmrc，而该变量为空，npm 会拿着空凭据去发布 —— scoped 包
          # 在无凭据时返回的是 404 而不是 401，极难排查。OIDC 自己会认 registry。

      - name: 升级 npm
        # Trusted Publishing 要求 npm ≥ 11.5.1。钉在 11.x：npm 12 刚发布，
        # 实测 12.0.2 在环境完全达标（id-token 已注入、无任何 auth 配置）时
        # 仍直接报 ENEEDAUTH，根本不发起 OIDC 交换。
        run: npm i -g npm@^11.5.1

      - name: OIDC 环境自检
        run: |
          echo "npm  $(npm --version)   node $(node --version)"
          echo "id-token 端点: ${ACTIONS_ID_TOKEN_REQUEST_URL:+已注入}${ACTIONS_ID_TOKEN_REQUEST_URL:-缺失（检查 permissions.id-token）}"
          echo "NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:+非空}${NODE_AUTH_TOKEN:-未设置（符合预期）}"
          echo "生效的 .npmrc:"; npm config list | sed -E 's#(_authToken *= *).*#\1<隐去>#'

      - run: npm ci

      - name: 校验 tag 与包版本一致
        # tag 与 package.json 对不上时，发出去的版本号会让人迷惑，不如直接失败
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/core packages/viewer-core; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "::error::$p 版本 $v 与 tag $tag 不一致"; exit 1; }
          done
          echo "tag $tag 与两个包版本一致"

      - name: 类型检查
        run: npm run check

      - name: 重新生成测试文件
        run: npm run fixtures

      - name: 核心解析 / 渲染测试
        run: npm run test:core

      - name: 图元文件解码测试
        run: npm run test:metafile

      # 两个包各自的 prepublishOnly 会跑一次 build，这里先构建一遍是为了
      # 万一构建失败，能在动 registry 之前就失败掉
      - name: 构建
        run: npm run build

      # 顺序不能反：viewer-core 以 @web-ppt/core 为 peer 依赖。
      # 在包目录内发布而非用 -w：OIDC 需要按包换取令牌，workspace 路径下
      # 是否走同一条代码路径没有保证，进包目录是文档示例里的形态。
      - name: 发布 @web-ppt/core
        working-directory: packages/core
        run: npm publish

      - name: 发布 @web-ppt/viewer-core
        working-directory: packages/viewer-core
        run: npm publish
