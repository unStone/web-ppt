name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 重新生成测试文件
        # fixture 由脚本手写 OOXML 生成，确保仓库里的与脚本一致
        run: npm run fixtures

      - name: 校验固件确定性
        # 生成脚本必须是确定性的：同样的输入重跑两次字节一致。
        # 否则任何人跑一次 npm run fixtures 都会带进无关 diff，
        # 甚至让快照随机漂移。
        run: git diff --exit-code --stat fixtures/

      - name: 核心解析 / 渲染测试
        run: npm run test:core

      - name: 编辑模型 / 投影测试
        run: npm run test:edit

      - name: 浏览器 DOM 编辑层功能测试
        run: npm run test:editor:functional

      # runner 的固定计算基线会随宿主并行负载从 5ms 漂到 40ms；beta.2 先保留
      # 采样与红灯证据，但不让已被环境自检判定受扰的 p95 阻断功能发布。
      - name: 浏览器 DOM 编辑层性能采样
        continue-on-error: true
        run: npm run test:editor:performance

      - name: 安装 LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress

      - name: 保存产物外部打开测试
        # 复用上一阶段通过最小差异合约的同一份字节，避免各自生成不同样本。
        run: |
          npm run test:edit:libreoffice -- out/edit-save/blank-new-document.pptx 2
          npm run test:edit:libreoffice -- out/edit-save/generated-empty.pptx 1
          npm run test:edit:libreoffice -- out/edit-save/generated-content.pptx 1
          npm run test:edit:libreoffice -- out/edit-save/generated-ppt-source.pptx 2
          npm run test:edit:libreoffice -- out/edit-save/generated-ppt-edited.pptx 2
          npm run test:edit:libreoffice -- out/edit-save/generated-ppt-unsupported.pptx 2
          npm run test:edit:libreoffice -- out/edit-save/generated-ppt-ole-preview.pptx 1
          npm run test:edit:libreoffice -- out/edit-save/group-elements.pptx 1
          npm run test:edit:libreoffice -- out/edit-save/ungroup-elements.pptx 1
          npm run test:edit:libreoffice -- out/site-editor-browser/sample.pptx 2
          npm run test:edit:libreoffice -- out/edit-save/single-move.pptx
          npm run test:edit:libreoffice -- out/edit-save/engine-text-editing.pptx
          npm run test:edit:libreoffice -- out/edit-save/table-cell-text-editing.pptx
          npm run test:edit:libreoffice -- out/edit-save/shape-autofit-text-editing.pptx
          npm run test:edit:libreoffice -- out/edit-save/body-props-editing.pptx

      - name: 编辑性能预算
        continue-on-error: true
        run: npm run bench:edit

      - name: 图元文件解码测试
        run: npm run test:metafile

      # 这两条此前只在 release.yml 里跑，PR 阶段发现不了适配包与协同包的回归
      - name: React / Vue 适配与体积门禁
        run: npm run test:adapters

      - name: 协同适配与收敛门禁
        run: npm run test:collab

      - name: 构建
        run: npm run build

      # 放在构建之后：体积核对要读 dist 产物。
      # 守的是单测碰不到的一类问题——LICENSE 与各处声明不符、npm 链接指向不存在的包、
      # 文档里的体积和快照数照抄旧值。
      - name: 跨产物一致性
        run: npm run verify

      - name: 上传快照差异
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-actual
          path: |
            test/snapshots/
            out/core/
          retention-days: 7
