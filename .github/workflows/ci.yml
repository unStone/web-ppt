name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PR 连续推送只保留最新运行；可信分支按 run_id 隔离，逐提交完整执行。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 类型检查
        run: npm run check
      - name: 重新生成测试文件
        run: npm run fixtures
      - name: 校验固件确定性
        run: git diff --exit-code --stat fixtures/
      - name: 构建
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            packages/*/dist/
            out/agent-describe/default-entry-proof.json
            out/agent-tools/default-entry-proof.json
            out/agent-mcp/default-entry-proof.json
          if-no-files-found: error
          retention-days: 1

  editing:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          office: 'true'
      - name: 源码编辑与保存契约
        run: node tooling/ci/run-group.mjs source editing
      - uses: actions/upload-artifact@v4
        with:
          name: source-editing
          path: out/ci-results/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: edit-inputs
          path: |
            out/edit-save/*.pptx
            out/comments/source-report.json
            out/v07-integration/*.pptx
            out/v07-integration/office-artifacts.json
            out/v08-integration/*.pptx
            out/v08-integration/office-artifacts.json
          if-no-files-found: error
          retention-days: 1
      - name: 上传快照差异
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-actual
          path: |
            test/snapshots/
            out/core/
          retention-days: 7

  source:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [agent, expanded, render, charts, equivalence-0, equivalence-1, equivalence-2, equivalence-3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.group == 'render' }}
          media: ${{ matrix.group == 'render' }}
      - name: 全量功能测试分组
        run: node tooling/ci/run-group.mjs source ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ matrix.group }}
          path: out/ci-results/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: editing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: edit-inputs
          path: out
      - name: 浏览器源码功能契约
        run: node tooling/ci/run-group.mjs source browser
      - uses: actions/upload-artifact@v4
        with:
          name: source-browser
          path: out/ci-results/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: site-sample
          path: out/site-editor-browser/sample.pptx
          if-no-files-found: error
          retention-days: 1

  dist:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [agent, expanded, render, charts]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: ${{ matrix.group == 'render' }}
          media: ${{ matrix.group == 'render' }}
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - name: 发布产物复验分组
        run: node tooling/ci/run-group.mjs dist ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.group }}
          path: out/ci-results/
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [editing, source, browser, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - uses: actions/download-artifact@v4
        with:
          pattern: source-*
          merge-multiple: true
          path: out/ci-results
      - uses: actions/download-artifact@v4
        with:
          name: edit-inputs
          path: out
      - name: 核对源码分组完整性与合并计数
        run: node tooling/ci/merge-results.mjs source
      - name: 跨产物一致性
        run: node tooling/ci/run-group.mjs dist base
      - uses: actions/upload-artifact@v4
        with:
          name: dist-base
          path: out/ci-results/
          if-no-files-found: error
          retention-days: 1

  site:
    needs: [editing, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: packages
      - uses: actions/download-artifact@v4
        with:
          name: edit-inputs
          path: out
      - name: 官网双语生产回归
        run: npm run test:site:i18n
        env:
          SITE_BASE: /web-ppt/
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: packages/site/dist/
          if-no-files-found: error
          retention-days: 7

  office:
    needs: [editing, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          office: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: edit-inputs
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: site-sample
          path: out/site-editor-browser
      - name: 保存产物外部打开测试
        run: node tooling/test-edit-libreoffice-all.mjs --include-site
      - name: 0.7 统一清单外部打开测试
        run: node tooling/test-v07-libreoffice-all.mjs
      - name: OLE 嵌入文档外部打开测试
        run: node tooling/test-ole-edit-libreoffice.mjs

  performance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # beta 阶段保留宿主负载证据；功能门禁不受受扰的 p95 影响。
      - name: 浏览器 DOM 编辑层性能采样
        continue-on-error: true
        run: npm run test:editor:performance
      - name: 编辑性能预算
        continue-on-error: true
        run: npm run bench:edit

  # 保留原 required check 名称；路径过滤只跳过重任务，不跳过此结论。
  check:
    if: always()
    needs: [changes, build, editing, source, browser, dist, verify, site, office, performance]
    runs-on: ubuntu-latest
    steps:
      - name: 核对全部门禁结论
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (jobs.changes.result !== "success") throw new Error("路径检查未成功"); const code = jobs.changes.outputs.code === "true"; for (const [name, job] of Object.entries(jobs)) { if (name === "changes") continue; const expected = code ? "success" : "skipped"; if (job.result !== expected) throw new Error(`${name}: ${job.result}, expected ${expected}`); }'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: needs.changes.outputs.code == 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code == 'true'
        with:
          pattern: source-*
          merge-multiple: true
          path: out/ci-results
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.code == 'true'
        with:
          pattern: dist-*
          merge-multiple: true
          path: out/ci-results
      - name: 核对全部执行计划
        if: needs.changes.outputs.code == 'true'
        run: node tooling/ci/merge-results.mjs all
