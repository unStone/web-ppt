name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: 类型检查
        run: npm run check

      - name: 重新生成测试文件
        # fixture 由脚本手写 OOXML 生成，确保仓库里的与脚本一致
        run: npm run fixtures

      - name: 校验固件确定性
        # 生成脚本必须是确定性的：同样的输入重跑两次字节一致。
        # 否则任何人跑一次 npm run fixtures 都会带进无关 diff，
        # 甚至让快照随机漂移。
        run: git diff --exit-code --stat fixtures/

      - name: 安装 LibreOffice 与中文字体
        # 功能门禁中的图元真实样本和后续外部 oracle 都依赖同一套环境。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress fonts-noto-cjk

      - name: 全量功能测试
        # 唯一入口与本地 npm test、发布流水线共用，避免拆分清单漏跑新套件。
        run: npm run test:functional

      # runner 的固定计算基线会随宿主并行负载从 5ms 漂到 40ms；beta.2 先保留
      # 采样与红灯证据，但不让已被环境自检判定受扰的 p95 阻断功能发布。
      - name: 浏览器 DOM 编辑层性能采样
        continue-on-error: true
        run: npm run test:editor:performance

      - name: 保存产物外部打开测试
        # manifest 是唯一产物清单；新增保存工件无需再维护第二份手写子集。
        run: node tooling/test-edit-libreoffice-all.mjs --include-site

      - name: 0.7 统一清单外部打开测试
        # 共用唯一清单，避免两套真实软件门禁的验收范围分叉。
        run: node tooling/test-v07-libreoffice-all.mjs

      - name: 编辑性能预算
        continue-on-error: true
        run: npm run bench:edit

      - name: 构建
        run: npm run build

      - name: 官网双语生产回归
        run: npm run test:site:i18n
        env:
          SITE_BASE: /web-ppt/

      # 放在构建之后：体积核对要读 dist 产物。
      # 守的是单测碰不到的一类问题——LICENSE 与各处声明不符、npm 链接指向不存在的包、
      # 文档里的体积和快照数照抄旧值。
      - name: 跨产物一致性
        run: npm run verify

      - name: 上传快照差异
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-actual
          path: |
            test/snapshots/
            out/core/
          retention-days: 7
