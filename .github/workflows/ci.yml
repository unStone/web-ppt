name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tooling/font-glyph-requirements.txt

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: 缓存 OOXML schema 与 NuGet 包
        # schema 由 prepare 脚本按 SHA256 钉版下载，脚本不变则内容不变；
        # NuGet 还原结果只取决于 csproj 的包引用版本。
        uses: actions/cache@v6
        with:
          path: |
            out/ooxml-schemas
            ~/.nuget/packages
          key: ooxml-${{ hashFiles('tooling/prepare-ooxml-schemas.mjs', 'tooling/ooxml-validate/ooxml-validate.csproj') }}

      - name: 安装字体与 PDF 独立读取依赖
        run: python3 -m pip install --target out/font-glyphs/python -r tooling/font-glyph-requirements.txt

      - name: 类型检查
        run: npm run check

      - name: 重新生成测试文件
        # fixture 由脚本手写 OOXML 生成，确保仓库里的与脚本一致
        run: npm run fixtures

      - name: 校验固件确定性
        # 生成脚本必须是确定性的：同样的输入重跑两次字节一致。
        # 否则任何人跑一次 npm run fixtures 都会带进无关 diff，
        # 甚至让快照随机漂移。
        run: git diff --exit-code --stat fixtures/ tooling/agent-eval/fixtures/

      - name: 安装 LibreOffice 与中文字体
        # 功能门禁中的图元真实样本和后续外部 oracle 都依赖同一套环境。
        # writer / calc 是 OLE 嵌入文档外部打开测试的导入 filter——只装 impress 时
        # soffice 对 .docx/.xlsx 报 "source file could not be loaded"。
        # ffmpeg 供视频导出测试生成媒体与独立提帧断言（缺失时相关套件自行降级）。
        # libxml2-utils 提供 OOXML 门禁的 xmllint（XSD 结构校验）。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-writer libreoffice-calc fonts-noto-cjk ffmpeg libxml2-utils

      - name: 全量功能测试
        # 唯一入口与本地 npm test、发布流水线共用，避免拆分清单漏跑新套件。
        run: npm run test:functional

      - name: 保存产物外部打开测试
        # manifest 是唯一产物清单；新增保存工件无需再维护第二份手写子集。
        run: node tooling/test-edit-libreoffice-all.mjs --include-site

      - name: 设计旅程统一清单外部打开测试
        # 共用唯一清单，避免两套真实软件门禁的验收范围分叉。
        run: node tooling/test-design-journey-libreoffice.mjs

      - name: OLE 嵌入文档外部打开测试
        # 嵌入 DOCX/XLSX 改写后由 LibreOffice 打开核对（票据 014 / 015 的外部读取器验收）
        run: node tooling/test-ole-edit-libreoffice.mjs

      - name: 构建
        run: npm run build

      - name: OOXML 合法性门禁
        # 依赖全量功能测试落盘的保存产物与 dist 构建：XSD（ECMA-376 Transitional）
        # 与 Open XML SDK 双通道校验，任一错误失败并打印错误 Id、部件与 XPath。
        run: npm run test:ooxml

      - name: 官网双语生产回归
        run: npm run test:site:i18n
        env:
          SITE_BASE: /web-ppt/

      # 放在构建之后：体积核对要读 dist 产物。
      # 守的是单测碰不到的一类问题——LICENSE 与各处声明不符、npm 链接指向不存在的包、
      # 文档里的体积和快照数照抄旧值。
      - name: 跨产物一致性
        run: npm run verify

      - name: 上传快照差异
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-actual
          path: |
            test/snapshots/
            out/core/
          retention-days: 7

  # 主门禁跑在 .node-version（当前 LTS）上；engines 声明的最低版本只复验
  # 直接在 Node 里运行的发布产物：本机 MCP、Node 渲染入口与 ZIP 安全边界。
  node-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 构建
        run: npm run build
      - name: 本机 MCP 发布产物
        run: npm run test:mcp:dist
      - name: Node 渲染发布入口
        run: node tooling/test-agent-node-render.mjs --dist
      - name: ZIP 安全发布入口
        run: npm run test:zip:dist
