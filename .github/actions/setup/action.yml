name: CI environment
description: 按套件准备 Node、字体和外部读取器
inputs:
  python:
    description: 安装 PDF 独立读取依赖
    default: 'false'
  office:
    description: 安装 LibreOffice 的 Impress、Writer 和 Calc
    default: 'false'
  media:
    description: 安装 ffmpeg
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - uses: actions/setup-python@v5
      if: inputs.python == 'true'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tooling/font-glyph-requirements.txt
    - name: 安装字体与 PDF 独立读取依赖
      if: inputs.python == 'true'
      run: python3 -m pip install --target out/font-glyphs/python -r tooling/font-glyph-requirements.txt
      shell: bash
    - name: 安装字体与外部读取器
      run: |
        packages=(fonts-noto-cjk)
        if [[ "$OFFICE" == true ]]; then packages+=(libreoffice-impress libreoffice-writer libreoffice-calc); fi
        if [[ "$MEDIA" == true ]]; then packages+=(ffmpeg); fi
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
      shell: bash
      env:
        OFFICE: ${{ inputs.office }}
        MEDIA: ${{ inputs.media }}
