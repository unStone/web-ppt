name: CI environment
description: 按套件准备 Node、字体和外部读取器
inputs:
  python:
    description: 安装 PDF 独立读取依赖
    default: 'false'
  office:
    description: impress 只安装演示文稿读取器，true 同时安装 Writer 和 Calc
    default: 'false'
  media:
    description: 安装 ffmpeg
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - uses: actions/setup-python@v7
      if: inputs.python == 'true'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: tooling/font-glyph-requirements.txt
    - name: 安装字体与 PDF 独立读取依赖
      if: inputs.python == 'true'
      run: python3 -m pip install --target out/font-glyphs/python -r tooling/font-glyph-requirements.txt
      shell: bash
    - name: 安装字体与外部读取器
      run: |
        packages=(fonts-noto-cjk)
        case "$OFFICE" in
          false) ;;
          impress) packages+=(libreoffice-impress) ;;
          true) packages+=(libreoffice-impress libreoffice-writer libreoffice-calc) ;;
          *) echo "不支持的 LibreOffice 配置：$OFFICE" >&2; exit 1 ;;
        esac
        if [[ "$MEDIA" == true ]]; then packages+=(ffmpeg); fi
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
      shell: bash
      env:
        OFFICE: ${{ inputs.office }}
        MEDIA: ${{ inputs.media }}
