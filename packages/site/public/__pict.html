<!doctype html><meta charset="utf-8"><title>pict probe</title>
<style>body{margin:0;background:#eee;font:11px system-ui}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.c{background:#fff;padding:2px}.c>svg{width:100%;height:auto;display:block}</style>
<div class="g" id="g"></div>
<script>
const names=[1,2,4,5,6,7,8,9,10,11,12];
document.getElementById('g').innerHTML = names.map(n=>`<div class="c"><div>pict-${n}</div><object data="/__p/pict-${n}.svg" type="image/svg+xml" style="width:100%"></object></div>`).join('');
</script>
